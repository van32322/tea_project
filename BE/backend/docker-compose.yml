version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tea-backend-app
    container_name: tea-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tea
      DB_USERNAME: root
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: tea-backend-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: tea
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  vendor:
  storage:
  dbdata:
